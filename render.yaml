# Render Blueprint for the free web service. (The live service was created by hand with
# the same build/start commands; this file documents them and can recreate the service.)
# Secrets marked `sync: false` are entered in the Render dashboard; never commit them.
#
# The MetaGPT worker is not included: it needs more than the free plan's 512 MB of RAM.
# Run it locally instead (see README) and leave METAGPT_WORKER_URL unset on Render.
services:
  - type: web
    name: Nexora-AI
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: chainlit run nexora_app.py --host 0.0.0.0 --port $PORT --headless
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NEXORA_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
      # Neon connection string (Dashboard -> Connect). Enables documents and chat history.
      - key: DATABASE_URL
        sync: false
      # Sign-in: "user:<hash>" pairs from `python -m nexora.auth`, comma separated.
      # Documents and chat history are only available to signed-in users.
      - key: NEXORA_USERS
        sync: false
      - key: CHAINLIT_AUTH_SECRET
        generateValue: true
