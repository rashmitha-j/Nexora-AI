services:
  - type: web
    name: nexora-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: chainlit run nexora_app.py --host 0.0.0.0 --port $PORT --headless
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Set the real key in the Render dashboard; never commit it.
      - key: GEMINI_API_KEY
        sync: false
